<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2340;
    --ink-soft: #4a5170;
    --paper: #eef0f4;
    --panel: #ffffff;
    --line: #d9dce6;
    --accent: #0e7c6b;
    --accent-dark: #0a5f52;
    --danger: #b3423a;
    --danger-dark: #93332c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 60px;
  }

  header.masthead {
    max-width: 1080px;
    margin: 0 auto 32px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  header.masthead h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header.masthead .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .layout {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 1px 3px rgba(27, 35, 64, 0.06);
  }

  .panel-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-head h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-dark);
    display: block;
    margin-bottom: 4px;
  }

  form { padding: 20px; }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: #fbfbfd;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(14, 124, 107, 0.12);
    background: #fff;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 10px 16px;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }

  .btn-primary { background: var(--accent); color: #fff; width: 100%; margin-top: 4px; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { background: #a9c6c0; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 6px 12px;
    font-size: 13px;
  }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid transparent;
    padding: 5px 10px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .btn-danger:hover { background: rgba(179, 66, 58, 0.08); border-color: rgba(179, 66, 58, 0.3); }
  .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }

  #formMsg {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 500;
    min-height: 18px;
  }
  #formMsg.ok { color: var(--accent-dark); }
  #formMsg.err { color: var(--danger); }

  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

  thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid #eceef3;
    vertical-align: top;
  }

  tbody tr:hover { background: #fafbfd; }

  tbody tr:last-child td { border-bottom: none; }

  .roll {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent-dark);
    font-weight: 500;
  }

  .muted { color: var(--ink-soft); font-size: 12.5px; }

  .empty-state, .load-state {
    padding: 48px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .empty-state strong { display: block; color: var(--ink); font-family: 'Source Serif 4', serif; font-size: 17px; margin-bottom: 6px; font-weight: 600; }

  .count-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--ink);
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .head-actions { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>

<header class="masthead">
  <div>
    <span class="tag">Registrar's Office · Records System</span>
    <h1>Student Registry</h1>
  </div>
</header>

<div class="layout">

  <div class="panel">
    <div class="panel-head">
      <h2>New Entry</h2>
    </div>
    <form id="studentForm">
      <span class="eyebrow">Enrollment</span>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" name="name" placeholder="e.g. Ananya Sharma" required />
      </div>
      <div class="field">
        <label for="rollNumber">Roll number</label>
        <input id="rollNumber" type="text" name="rollNumber" placeholder="e.g. CS-2026-014" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="name@college.edu" required />
      </div>
      <div class="field">
        <label for="course">Course</label>
        <input id="course" type="text" name="course" placeholder="e.g. B.Tech Computer Science" required />
      </div>
      <div class="field">
        <label for="phone">Phone <span class="muted">(optional)</span></label>
        <input id="phone" type="text" name="phone" placeholder="10-digit number" />
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Save record</button>
      <div id="formMsg"></div>
    </form>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Records <span class="count-badge" id="countBadge">0</span></h2>
      <div class="head-actions">
        <button class="btn btn-ghost" id="reloadBtn" type="button">↻ Reload</button>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div class="load-state">Loading records…</div>
    </div>
  </div>

</div>

<script>
const form = document.getElementById('studentForm');
const formMsg = document.getElementById('formMsg');
const submitBtn = document.getElementById('submitBtn');
const tableWrap = document.getElementById('tableWrap');
const countBadge = document.getElementById('countBadge');
const reloadBtn = document.getElementById('reloadBtn');

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
}

async function loadStudents() {
  tableWrap.innerHTML = '<div class="load-state">Loading records…</div>';
  try {
    const res = await fetch('/api/students');
    if (!res.ok) throw new Error('bad status');
    const students = await res.json();
    renderTable(students);
  } catch (err) {
    tableWrap.innerHTML = '<div class="empty-state"><strong>Could not load records</strong>The records service is unreachable. Try reloading.</div>';
    countBadge.textContent = '—';
  }
}

function renderTable(students) {
  countBadge.textContent = students.length;

  if (students.length === 0) {
    tableWrap.innerHTML = '<div class="empty-state"><strong>No records yet</strong>Entries you save will appear here.</div>';
    return;
  }

  const rows = students.map((s) => `
    <tr data-id="${s._id}">
      <td class="roll">${escapeHtml(s.rollNumber)}</td>
      <td>${escapeHtml(s.name)}</td>
      <td>${escapeHtml(s.course)}</td>
      <td>${escapeHtml(s.email)}</td>
      <td>${escapeHtml(s.phone) || '<span class="muted">—</span>'}</td>
      <td class="muted">${formatDate(s.createdAt)}</td>
      <td><button class="btn btn-danger" data-delete="${s._id}">Delete</button></td>
    </tr>
  `).join('');

  tableWrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Roll no.</th>
          <th>Name</th>
          <th>Course</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Added</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  tableWrap.querySelectorAll('[data-delete]').forEach((btn) => {
    btn.addEventListener('click', () => deleteStudent(btn.getAttribute('data-delete'), btn));
  });
}

async function deleteStudent(id, btn) {
  if (!confirm('Remove this record? This cannot be undone.')) return;
  btn.disabled = true;
  btn.textContent = 'Removing…';
  try {
    const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('delete failed');
    await loadStudents();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Delete';
    alert('Could not delete this record. Try again.');
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());

  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';
  formMsg.textContent = '';
  formMsg.className = '';

  try {
    const res = await fetch('/api/students', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) {
      formMsg.textContent = 'Record saved.';
      formMsg.className = 'ok';
      form.reset();
      await loadStudents();
    } else {
      const body = await res.json().catch(() => ({}));
      formMsg.textContent = body.error || 'Failed to save details.';
      formMsg.className = 'err';
    }
  } catch (err) {
    formMsg.textContent = 'Could not reach the server.';
    formMsg.className = 'err';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save record';
  }
});

reloadBtn.addEventListener('click', loadStudents);

loadStudents();
</script>
</body>
</html>

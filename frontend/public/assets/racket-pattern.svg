      <line x1="9" y1="-32" x2="9" y2="32"/>
      <line x1="18" y1="-24" x2="18" y2="24"/>
      <line x1="-25" y1="-11" x2="25" y2="-11"/>
      <line x1="-27" y1="0" x2="27" y2="0"/>
      <line x1="-25" y1="11" x2="25" y2="11"/>
      <line x1="0" y1="36" x2="0" y2="72" stroke-width="4"/>
    </g>
    <!-- Shuttlecock 2 -->
    <g transform="translate(45,180) rotate(-40)">
      <circle cx="0" cy="0" r="6"/>

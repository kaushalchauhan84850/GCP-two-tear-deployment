name: Deploy - DEV

on:
  push:
    branches: [dev]

env:
  PROJECT_ID: dev-infra-503304
  REGION: asia-south1
  ZONE: asia-south1-a
  ENVIRONMENT: dev
  TF_STATE_BUCKET: dev-infra-503304-tfstate
  IMAGE_TAG: dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/student-backend:${{ env.IMAGE_TAG }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/student-frontend:${{ env.IMAGE_TAG }}

  terraform:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state/${{ env.ENVIRONMENT }}"

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var-file="environments/${{ env.ENVIRONMENT }}.tfvars" \
            -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -var="image_tag=${{ env.IMAGE_TAG }}" \
            -var="mongo_uri=${{ secrets.MONGO_URI_DEV }}"

  redeploy-containers:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull latest images on backend VM (via IAP)
        run: |
          gcloud compute ssh ${{ env.ENVIRONMENT }}-backend-vm \
            --zone=${{ env.ZONE }} --project=${{ env.PROJECT_ID }} --tunnel-through-iap \
            --command="cd /opt/app && sudo docker compose pull && sudo docker compose up -d"

      - name: Pull latest images on frontend VM (via IAP)
        run: |
          gcloud compute ssh ${{ env.ENVIRONMENT }}-frontend-vm \
            --zone=${{ env.ZONE }} --project=${{ env.PROJECT_ID }} --tunnel-through-iap \
            --command="cd /opt/app && sudo docker compose pull && sudo docker compose up -d"
